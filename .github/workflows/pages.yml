name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check static site
        run: |
          node --check dist/app.js
          test -s dist/index.html
          test -s dist/assets/lotus-exige-240.glb
          test -s dist/vendor/draco/draco_decoder.wasm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Version browser assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          let html = readFileSync('dist/index.html', 'utf8');
          for (const file of ['app.js', 'design.css']) {
            const version = createHash('sha256').update(readFileSync(`dist/${file}`)).digest('hex').slice(0, 12);
            html = html.replaceAll(`"${file}"`, `"${file}?v=${version}"`);
          }
          writeFileSync('dist/index.html', html);
          NODE
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
